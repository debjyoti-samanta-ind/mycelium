name: Synthesise Opinions

on:
  schedule:
    - cron: '0 23 * * 0'  # Every Sunday at 11pm UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelium-data
  cancel-in-progress: false

jobs:
  synthesise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      - name: Run opinion synthesis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/opinions.py

      - name: Commit updated opinions
        run: |
          git config user.name "Mycelium Bot"
          git config user.email "mycelium@users.noreply.github.com"
          git add data/opinions.json
          git diff --staged --quiet && echo "No opinion changes to commit." || git commit -m "chore: update opinions [skip ci]"
          git push
