name: Ingest Articles

on:
  push:
    branches: [master]
    paths:
      - 'data/queue.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic requests

      - name: Run ingestion script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/ingest.py

      - name: Commit processed articles
        run: |
          git config user.name "Mycelium Bot"
          git config user.email "mycelium@users.noreply.github.com"
          git add data/articles/ data/graph.json
          git diff --staged --quiet && echo "Nothing new to commit." || git commit -m "chore: ingest articles [skip ci]"
          git push
