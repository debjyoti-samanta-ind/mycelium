name: Blind Spot Agent

on:
  schedule:
    - cron: '0 6 1 * *'  # 6am UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelium-data
  cancel-in-progress: false

jobs:
  blind-spot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install anthropic

      - name: Run Blind Spot agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python .github/scripts/blind_spot.py

      - name: Commit Blind Spot output
        run: |
          git config user.name "Mycelium Bot"
          git config user.email "mycelium@users.noreply.github.com"
          git add data/blind_spot_outputs.json data/agent_log.json
          git diff --staged --quiet && echo "No Blind Spot output to commit." || git commit -m "chore: update blind spot output [skip ci]"
          git push
