name: Recompute Dashboard

on:
  schedule:
    - cron: '0 6 1 * *'  # 6am UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelium-data
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recompute dashboard
        run: python .github/scripts/compute_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "Mycelium Bot"
          git config user.email "mycelium@users.noreply.github.com"
          git add data/dashboard.json
          git diff --staged --quiet && echo "No changes." || git commit -m "chore: recompute dashboard [skip ci]"
          git push
