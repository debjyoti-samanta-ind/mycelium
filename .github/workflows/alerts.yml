name: Send Surprise Alerts

on:
  schedule:
    - cron: '0 20 * * 0'  # Every Sunday at 8pm UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mycelium-data
  cancel-in-progress: false

jobs:
  alert:
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send alerts for surprise connections
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python .github/scripts/alerts.py

      - name: Commit updated alerts log
        run: |
          git config user.name "Mycelium Bot"
          git config user.email "mycelium@users.noreply.github.com"
          git add data/alerts.json
          git diff --staged --quiet && echo "No new alerts to commit." || git commit -m "chore: log sent alerts [skip ci]"
          git push
